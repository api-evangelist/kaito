aid: kaito
name: KAITO
description: >-
  KAITO (Kubernetes AI Toolchain Operator) is an open-source operator suite
  that automates LLM model inference, fine-tuning, and Retrieval Augmented
  Generation (RAG) engine deployment in Kubernetes clusters. It simplifies
  the process of deploying large AI models through optimized preset
  configurations and integrates with Karpenter for GPU node auto-provisioning.
